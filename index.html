<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>学習記録</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FDFCF8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学習記録">
<meta name="description" content="タスクとテストの点数を、端末の中だけで記録します。">
<style>
/* ============================================================
   依存ゼロ。外部からの読み込みは一切ない。
   フォントはOS標準のみ。通信コードを含まない。
   ============================================================ */
:root{
  --paper:#FFFDF8; --ink:#1A1D21; --ink-soft:#5A6169; --ink-faint:#9AA2A9;
  --red:#D9342A; --indigo:#2A5D8A; --rule:#E4E1D8; --panel:#F7F5EF; --gold:#B8860B;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  font-size:15px;line-height:1.7;overscroll-behavior-y:none;
}

button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

/* layout */
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
.view{flex:1;padding:14px 18px calc(84px + var(--safe-b));}
body.hint .view{padding-bottom:calc(240px + var(--safe-b));}
.vhead{padding-top:10px;}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--ink-faint);margin:0 0 2px;}
h1.t{font-size:23px;font-weight:800;margin:0 0 3px;letter-spacing:.01em;}
p.sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
.sec{font-size:11px;letter-spacing:.14em;color:var(--ink-faint);margin:20px 0 6px;}

/* tabs */
nav#tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:rgba(247,245,239,.97);border-top:1px solid var(--rule);
  padding-bottom:var(--safe-b);backdrop-filter:blur(8px);
}
nav#tabs button{flex:1;padding:10px 0 12px;font-size:10.5px;color:var(--ink-faint);}
nav#tabs button.on{color:var(--red);font-weight:700;box-shadow:inset 0 2px 0 var(--red);}
nav#tabs.hide{display:none;}

/* controls */
.field{border-bottom:1px solid var(--rule);padding:10px 0;}
.field label{display:block;font-size:10px;letter-spacing:.12em;color:var(--ink-faint);margin-bottom:2px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{
  width:100%;border:0;background:transparent;padding:2px 0;font-size:16px;font-weight:500;
}
.field textarea{resize:vertical;min-height:44px;font-weight:400;font-size:15px;}
.hint{font-size:11px;color:var(--ink-faint);margin-top:5px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.chip{border:1px solid var(--rule);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--ink-soft);background:#fff;}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff;}
.chip.add{border-style:dashed;color:var(--ink-faint);}
.btn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;border-radius:11px;padding:14px;font-size:14.5px;font-weight:700;margin-top:16px;}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--rule);font-weight:500;}
.btn.red{background:var(--red);}
.btn[disabled]{background:#E6E3DB;color:#A7ADB2;cursor:default;}
.btn.sm{padding:10px;font-size:13px;margin-top:10px;}
.row2{display:flex;gap:10px;}
.row2 .btn{margin-top:12px;}

/* list */
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule);}
.item .body{flex:1;min-width:0;}
.item .tt{font-size:14.5px;font-weight:500;word-break:break-word;}
.item .tt.done{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--red);}
.item.isdone{opacity:.5;}
.item .mm{font-size:11px;color:var(--ink-faint);margin-top:1px;}
.cbx{width:22px;height:22px;border:1.5px solid #B9C0C6;border-radius:6px;flex:none;margin-top:2px;position:relative;}
.cbx.on{border-color:var(--red);background:var(--red);}
.cbx.on::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);}
.tag{font-size:10px;padding:1px 7px;border-radius:4px;background:#EEF2F4;color:var(--indigo);margin-left:4px;white-space:nowrap;}
.tag.due{background:#FBE6E4;color:var(--red);}
.tag.max{background:#F1EEE4;color:#7A6314;}
.tag.mute{background:#EFEDE7;color:#8E959B;}
.bar{height:6px;border-radius:99px;background:#EDEAE2;overflow:hidden;margin-top:6px;}
.bar i{display:block;height:100%;background:var(--indigo);}
.bar i.low{background:var(--red);}
.empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:30px 10px;border:1px dashed var(--rule);border-radius:12px;margin-top:12px;}

/* maru */
.maru{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.maru svg{position:absolute;inset:-16% -12%;width:124%;height:132%;overflow:visible;}
.maru svg path{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw .95s .15s cubic-bezier(.6,.1,.3,1) forwards;}
@keyframes draw{to{stroke-dashoffset:0}}
.maru .n{color:var(--red);font-weight:800;line-height:1;letter-spacing:-.02em;}
.big .n{font-size:56px;}
.sm .n{font-size:21px;}
.plain{font-weight:700;font-size:21px;color:var(--ink-soft);}
.plain.big{font-size:52px;color:var(--ink);}
@media (prefers-reduced-motion:reduce){.maru svg path{animation:none;stroke-dashoffset:0}}

/* cards */
.card{border:1px solid var(--rule);border-radius:12px;padding:13px 14px;background:#fff;margin-top:12px;}
.card.ink{border-color:var(--ink);}
.note{border:1px dashed #C9CFD3;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink-soft);background:#FAF9F4;margin-top:12px;}
.note b{color:var(--ink);}
.warn{border-left:3px solid var(--red);background:#FCF1EF;padding:10px 12px;font-size:12.5px;color:#7E2B23;margin:12px 0;border-radius:0 8px 8px 0;}
.info{border-left:3px solid var(--gold);background:#FFF8E1;padding:10px 12px;font-size:12.5px;color:#7A6314;margin:12px 0;border-radius:0 8px 8px 0;}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;}
.stat:last-child{border-bottom:0;}
.stat b{font-weight:700;font-size:15px;}
.goalv{font-size:32px;font-weight:800;letter-spacing:-.01em;}
.sw{width:44px;height:26px;border-radius:99px;background:#D8DCE0;position:relative;flex:none;transition:background .15s;}
.sw.on{background:var(--red);}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:left .15s;}
.sw.on::after{left:21px;}
.rowsplit{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);}
.rowsplit .k{font-size:14px;font-weight:500;}
.rowsplit .d{font-size:11.5px;color:var(--ink-faint);}

/* lock */
#lock{position:fixed;inset:0;z-index:100;background:#161A18;color:#E9E6DC;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#lock .dots{display:flex;gap:16px;margin:26px 0 30px;}
#lock .dot{width:12px;height:12px;border-radius:99px;border:1.5px solid #7C8A80;}
#lock .dot.f{background:#E9E6DC;border-color:#E9E6DC;}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px;}
#lock .pad button{font-size:24px;color:#E9E6DC;padding:14px 0;border-radius:99px;border:1px solid rgba(233,230,220,.18);}
#lock .pad button.blank{border:0;}
#lock .pad button.small{font-size:13px;border:0;color:#8FA095;}
#lock .msg{font-size:12.5px;color:#8FA095;min-height:20px;}

/* modal */
#modal{position:fixed;inset:0;z-index:90;background:rgba(20,24,22,.5);display:flex;align-items:flex-end;justify-content:center;}
#modal .sheet{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + var(--safe-b));max-height:90vh;overflow:auto;}
.hidden{display:none !important;}
/* カレンダー */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px;}
.calhead .m{font-size:16px;font-weight:700;}
.calhead button{border:1px solid var(--rule);border-radius:8px;padding:5px 13px;font-size:14px;color:var(--ink-soft);background:#fff;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal .wd{text-align:center;font-size:10px;color:var(--ink-faint);padding:2px 0 4px;}
.cal .wd.s{color:var(--indigo);} .cal .wd.t{color:var(--red);}
.cal .d{aspect-ratio:1/1;border-radius:9px;background:#fff;border:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:13.5px;color:var(--ink);padding:0;}
.cal .d.out{background:transparent;border-color:transparent;color:#CDD2D6;}
.cal .d.today{border-color:var(--ink);border-width:1.5px;font-weight:700;}
.cal .d.sel{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}
.cal .dots{display:flex;gap:2.5px;height:5px;}
.cal .dot{width:5px;height:5px;border-radius:99px;}
.cal .d.sel .dot{outline:1px solid rgba(255,255,255,.5);}
.dk-task{background:var(--indigo);} .dk-rec{background:#4A5560;}
.dk-test{background:var(--red);} .dk-free{background:var(--gold);}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 2px;font-size:11px;color:var(--ink-soft);}
.legend span{display:flex;align-items:center;gap:5px;}
.legend i{width:7px;height:7px;border-radius:99px;display:block;}
.daybox{border-top:1px solid var(--rule);margin-top:14px;padding-top:10px;}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.addgrid button{border:1px solid var(--rule);border-radius:10px;padding:11px 6px;font-size:12.5px;
  color:var(--ink);background:#fff;font-weight:500;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));
  z-index:120;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;
  max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out;}
.toast.out{opacity:0;transition:opacity .3s;}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#install{position:fixed;left:12px;right:12px;bottom:calc(70px + var(--safe-b));z-index:50;
  max-width:536px;margin:0 auto;background:var(--ink);color:#fff;border-radius:12px;
  padding:13px 14px;font-size:12.5px;line-height:1.75;box-shadow:0 10px 30px rgba(0,0,0,.25);
  display:flex;gap:10px;align-items:flex-start;max-height:70vh;overflow:auto;}
#install b{font-weight:700;}
#install button{color:#fff;opacity:.65;font-size:12px;flex:none;padding:4px 6px;margin-top:-2px;}

/* print sheet */
#printarea{display:none;}
@media print{
  body::before{display:none;}
  #app,nav#tabs,#lock,#modal{display:none !important;}
  #printarea{display:block !important;padding:0;}
  @page{size:A4 portrait;margin:14mm;}
}
#sheetpreview{background:#fff;border:1px solid var(--rule);padding:14px;margin-top:12px;font-size:11px;}
.sheet-h{font-size:14px;font-weight:800;margin:0 0 2px;}
.sheet-m{font-size:10px;color:var(--ink-faint);margin-bottom:8px;}
table.sh{width:100%;border-collapse:collapse;font-size:11px;}
table.sh th{text-align:left;border-bottom:1.5px solid var(--ink);padding:4px 2px;font-weight:600;font-size:10px;}
table.sh td{border-bottom:1px solid var(--rule);padding:4px 2px;}
table.sh td.num{text-align:right;font-variant-numeric:tabular-nums;}
.freebox{border:1px solid var(--rule);height:70px;margin-top:8px;}
</style>
</head>
<body>

<div id="app"><div class="view" id="view"></div></div>
<nav id="tabs" class="hide"></nav>
<div id="lock" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="printarea"></div>
<div id="install" class="hidden"></div>

<script>
"use strict";
/* ============================================================
   1. 保存層
   IndexedDB を第一とし、失敗時のみメモリ上に保持する。
   通信は行わない。fetch / XMLHttpRequest は使用しない。
   ============================================================ */
const Store = (() => {
  const DB="study_local", ST="kv", KEY="state";
  let db=null, mem=null, ok=false;
  function open(){
    return new Promise(res=>{
      if(!("indexedDB" in window)) return res(false);
      let r;
      try{ r=indexedDB.open(DB,1); }catch(e){ return res(false); }
      r.onupgradeneeded=()=>{ r.result.createObjectStore(ST); };
      r.onsuccess=()=>{ db=r.result; ok=true; res(true); };
      r.onerror=()=>res(false);
      setTimeout(()=>{ if(!ok) res(false); },2500);
    });
  }
  function get(k){
    k=k||KEY;
    return new Promise(res=>{
      if(!db) return res(k===KEY? mem : null);
      try{
        const tx=db.transaction(ST,"readonly").objectStore(ST).get(k);
        tx.onsuccess=()=>res(tx.result ?? (k===KEY? mem : null));
        tx.onerror=()=>res(k===KEY? mem : null);
      }catch(e){ res(k===KEY? mem : null); }
    });
  }
  function set(v,k){
    k=k||KEY;
    if(k===KEY) mem=v;
    return new Promise(res=>{
      if(!db) return res(false);
      try{
        const tx=db.transaction(ST,"readwrite").objectStore(ST).put(v,k);
        tx.onsuccess=()=>res(true);
        tx.onerror=()=>res(false);
      }catch(e){ res(false); }
    });
  }
  return {open,get,set,persistent:()=>ok};
})();

/* ============================================================
   2. 状態
   ============================================================ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const KINDS={small:"小テスト",unit:"単元テスト",term:"定期テスト"};
const TASKKINDS={hw:"課題",submit:"提出物",item:"持ち物"};

let S=null, dirty=false, lockTimer=null, lastActive=Date.now();

/* ------------------------------------------------------------
   データ形式の版と、その移行
   構造を変えるときは SCHEMA を上げ、MIGRATIONS に一段ずつ足す。
   移行の前には、必ず元の状態を別のキーに退避する。
   ------------------------------------------------------------ */
const SCHEMA=3;
function blank(){
  return {
    v:SCHEMA, students:[], activeId:null, subjects:[], tests:[], records:[], tasks:[], events:[],
    settings:{ pass:null, failCount:0, lockUntil:null, autoLock:3, lastExport:null,
               grouped:{}, goals:{}, remindExport:true }
  };
}
const MIGRATIONS={
  // v2 → v3：予定(events)の新設。テスト予告のやることを予定へ移す。
  2(st){
    st.events=st.events||[];
    const rest=[];
    (st.tasks||[]).forEach(t=>{
      if(t.kind==="exam"){
        st.events.push({id:t.id,studentId:t.studentId,date:t.due||null,
          title:t.title,kind:"test",subjectId:t.subjectId||null,note:t.memo||""});
      }else rest.push(t);
    });
    st.tasks=rest;
    return st;
  },
  // v1 → v2：設定項目の追加と、参照切れの掃除
  1(st){
    st.settings=st.settings||{};
    if(st.settings.failCount==null) st.settings.failCount=0;
    if(st.settings.lockUntil==null) st.settings.lockUntil=null;
    const tid=new Set((st.tests||[]).map(t=>t.id));
    const sid=new Set((st.students||[]).map(s=>s.id));
    st.records=(st.records||[]).filter(r=>tid.has(r.testId)&&sid.has(r.studentId));
    st.tasks=(st.tasks||[]).filter(t=>sid.has(t.studentId));
    st.events=(st.events||[]).filter(e=>sid.has(e.studentId));
    st.tests=(st.tests||[]).filter(t=>sid.has(t.studentId));
    return st;
  }
};
function migrate(raw){
  let st;
  try{ st=JSON.parse(JSON.stringify(raw)); }catch(e){ return {error:"broken"}; }
  if(typeof st.v!=="number") st.v=1;
  if(st.v>SCHEMA) return {error:"newer", found:st.v};
  const from=st.v;
  while(st.v<SCHEMA){
    const step=MIGRATIONS[st.v];
    if(!step){ st.v=SCHEMA; break; }
    try{ st=step(st); }catch(e){ return {error:"failed", at:st.v}; }
    st.v++;
  }
  const out=Object.assign(blank(),st);
  out.settings=Object.assign(blank().settings, st.settings||{});
  out.v=SCHEMA;
  return {state:out, migrated: from!==SCHEMA, from};
}
function save(){
  dirty=true;
  clearTimeout(save._t);
  save._t=setTimeout(()=>{ Store.set(S).then(()=>{dirty=false;}); },250);
}
/* 追加・削除・記録の確定など、直後に画面が変わる操作で使う即時保存 */
async function saveNow(){
  clearTimeout(save._t);
  dirty=false;
  await Store.set(S);
}
const me = ()=> S.students.find(s=>s.id===S.activeId) || S.students[0] || null;
const mine = arr => arr.filter(x=>x.studentId===S.activeId);

/* 日付ユーティリティ */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
function addDays(s,n){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
const WD=["日","月","火","水","木","金","土"];
function fmt(s,withYear){
  if(!s) return "";
  const d=new Date(s+"T00:00:00");
  const base=`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  return withYear? `${d.getFullYear()}年 ${base}` : base;
}
function diffDays(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function relDay(s){
  const d=diffDays(today(),s);
  if(d===0) return "今日"; if(d===1) return "明日"; if(d===-1) return "昨日";
  if(d<0) return `${-d}日前`; return `${d}日後`;
}

/* ============================================================
   3. 統計
   記述統計のみ。回帰は傾向の判定と目標の算出にのみ用い、
   点数の予測値としては表示しない。
   ============================================================ */
const MIN_N=5; // これ未満では傾向も目標も出さない

function recordsOf(testIds){
  return mine(S.records).filter(r=>testIds.includes(r.testId))
    .slice().sort((a,b)=> a.date<b.date?-1: a.date>b.date?1:0);
}
function mean(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0; }
function median(a){
  if(!a.length) return 0;
  const s=a.slice().sort((x,y)=>x-y), m=s.length>>1;
  return s.length%2? s[m] : (s[m-1]+s[m])/2;
}
function slope(ys){ // 単回帰の傾き（x は 0,1,2...）
  const n=ys.length; if(n<2) return 0;
  const mx=(n-1)/2, my=mean(ys);
  let num=0,den=0;
  for(let i=0;i<n;i++){ num+=(i-mx)*(ys[i]-my); den+=(i-mx)*(i-mx); }
  return den? num/den : 0;
}
function analyze(tests){
  const ids=tests.map(t=>t.id), rs=recordsOf(ids);
  if(!rs.length) return null;
  const maxOf=id=>(S.tests.find(t=>t.id===id)||{max:100}).max;
  const rates=rs.map(r=>r.score/maxOf(r.testId)*100);
  const sameMax=tests.every(t=>t.max===tests[0].max);
  const max=tests[0].max;
  const scores=rs.map(r=>r.score);
  const last3=scores.slice(-3), last3r=rates.slice(-3);
  const a={
    n:rs.length, records:rs, rates, sameMax, max,
    avgRate:mean(rates), medRate:median(rates), avgScore:mean(scores),
    best:sameMax? Math.max(...scores):null,
    bestRate:Math.max(...rates),
    recent3:sameMax? mean(last3):null, recent3Rate:mean(last3r),
    enough: rs.length>=MIN_N, trend:null, goal:null, goalNote:""
  };
  if(a.enough){
    const win=rates.slice(-10), sl=slope(win);
    a.trend = sl>1.2? "上向き" : sl<-1.2? "やや下向き" : "横ばい";
    a.slope=sl;
    // 目標は素点で示す。まとめて見ている場合は、いま使っているテストの満点に換算する。
    const cm = sameMax? max : maxOf(rs[rs.length-1].testId);
    const base = sameMax? a.recent3 : a.recent3Rate/100*cm;
    const bestS = sameMax? a.best : Math.round(a.bestRate/100*cm);
    const step=Math.max(1,Math.round(cm*0.06));
    let g=Math.min(cm, Math.ceil(base)+step);
    if(bestS>=cm){ g=cm; a.goalNote="満点をもう一度"; }
    else if(g<=bestS){ g=bestS+1; a.goalNote="自己ベスト更新"; }
    else a.goalNote=`直近の平均より${g-Math.round(base)}点上`;
    a.goal=Math.min(g,cm);
    a.goalMax=cm;
  }
  return a;
}
/* 目標：本人が決めたものを最優先。無ければ記録から算出したものを使う。 */

}

/* ============================================================
   4. 暗号（書き出し／読み込み・パスコード）
   ============================================================ */
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pass,salt,iter){
  const km=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},km,
    {name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptJSON(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await keyFrom(pass,salt,250000);
  const data=enc.encode(JSON.stringify(obj));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data);
  const sum=await crypto.subtle.digest("SHA-256",data);
  return {f:"study-backup",v:1,alg:"AES-GCM/PBKDF2-250k",
    salt:b64(salt),iv:b64(iv),data:b64(ct),check:code(sum)};
}
async function decryptJSON(file,pass){
  const key=await keyFrom(pass,unb64(file.salt),250000);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(file.iv)},key,unb64(file.data));
  return {obj:JSON.parse(dec.decode(pt)), check:code(await crypto.subtle.digest("SHA-256",pt))};
}
function code(buf){
  const h=[...new Uint8Array(buf)].slice(0,6).map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
  return `${h.slice(0,4)}-${h.slice(4,8)}-${h.slice(8,12)}`;
}
async function hashPass(p,saltB64){
  const salt=saltB64? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const km=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,256);
  return {salt:b64(salt),hash:b64(bits)};
}

const EVKINDS={test:"テストの予定",free:"予定"};
function ym(d){ return d.slice(0,7); }
function monthCells(m){
  const [y,mo]=m.split("-").map(Number);
  const first=new Date(y,mo-1,1);
  const start=new Date(y,mo-1,1-first.getDay());
  const cells=[];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(iso(d)); }
  while(cells.length>35 && cells.slice(35).every(c=>ym(c)!==m)) cells.length=35;
  return cells;
}
function shiftMonth(m,n){
  const [y,mo]=m.split("-").map(Number);
  const d=new Date(y,mo-1+n,1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
}

    if(it.recs.length) dots.push("dk-rec");
    if(it.evs.some(e=>e.kind==="test")) dots.push("dk-test");

    const cls=["d"];
    if(ym(d)!==m) cls.push("out");
    if(d===today()) cls.push("today");
    if(d===sel) cls.push("sel");
    return `<button class="${cls.join(" ")}" data-day="${d}">
      <span>${+d.slice(8)}</span>
      <span class="dots">${dots.slice(0,4).map(k=>`<i class="dot ${k}"></i>`).join("")}</span></button>`;
  };

  let detail="";
  if(sel){
    const it=dayItems(sel);
    const rows=[];
    it.evs.forEach(e=>rows.push(`<div class="item"><div class="body">
      <div class="tt">${esc(e.title)}<span class="tag ${e.kind==="test"?"due":""}">${EVKINDS[e.kind]}</span></div>
      <div class="mm">${e.subjectId?esc(subName(e.subjectId))+"・":""}${esc(e.note||"")}</div></div>
      ${e.kind==="test"?`<button class="chip" data-recfor="${sel}">点数</button>`:""}
      <button class="chip" data-eved="${e.id}">直す</button></div>`));
    it.tasks.forEach(t=>rows.push(`<div class="item">
      <button class="cbx ${t.done?"on":""}" data-done="${t.id}" aria-label="完了"></button>
      <div class="body"><div class="tt ${t.done?"done":""}">${esc(t.title)}<span class="tag">${TASKKINDS[t.kind]||"やること"}</span></div>
      <div class="mm">${t.subjectId?esc(subName(t.subjectId)):""}</div></div></div>`));
    it.recs.forEach(r=>{
      const t=S.tests.find(x=>x.id===r.testId)||{name:"?",max:100};
      rows.push(`<div class="item"><div class="body">
        <div class="tt">${esc(t.name)}<span class="tag max">${t.max}点</span></div>
        <div class="mm">記録した点数</div></div>
        <span class="plain sm">${r.score} / ${t.max}</span></div>`);
    });
    detail=`<div class="daybox">
      <p class="s-head" style="font-size:13px;color:var(--ink);font-weight:700;margin:0 0 4px">${fmt(sel,true)}</p>
      ${rows.length? rows.join("") : `<div class="empty" style="padding:18px">この日は何もありません</div>`}
      <div class="addgrid">
        <button data-add="task">＋ やること</button>
        <button data-add="test">＋ テストの予定</button>
        <button data-add="free">＋ 予定</button>
        <button data-add="score">＋ 点数を記録</button>
      </div></div>`;
  }

  V.innerHTML=`
  <div class="vhead"><h1 class="t">カレンダー</h1>
  <p class="sub">日を選ぶと、その日の予定と記録が見られます。</p></div>
  <div class="calhead">
    <button data-mv="-1">‹</button>
    <span class="m">${yy}年 ${+mm}月</span>
    <button data-mv="1">›</button>
  </div>
  <div class="cal">
    ${["日","月","火","水","木","金","土"].map((w,i)=>
      `<div class="wd ${i===0?"t":i===6?"s":""}">${w}</div>`).join("")}
    ${cells.map(cell).join("")}
  </div>
  <div class="legend">
    <span><i class="dk-task"></i>やること</span>
    <span><i class="dk-test"></i>テスト</span>
    <span><i class="dk-free"></i>予定</span>
    <span><i class="dk-rec"></i>記録した点数</span>
  </div>
  ${detail}`;

  V.onclick=async e=>{
    const mv=e.target.closest("[data-mv]");
    if(mv) return go("cal",{m:shiftMonth(m,+mv.dataset.mv),d:null});
    const dy=e.target.closest("[data-day]");
    if(dy){ const d=dy.dataset.day; return go("cal",{m:ym(d),d}); }
    const ck=e.target.closest("[data-done]");
    if(ck){ const t=S.tasks.find(x=>x.id===ck.dataset.done);
      t.done=!t.done; t.doneAt=t.done?today():null; await saveNow(); return render(); }
    const ed=e.target.closest("[data-eved]");
    if(ed) return go("evadd",{id:ed.dataset.eved});
    const rf=e.target.closest("[data-recfor]");
    if(rf) return go("rec",{date:rf.dataset.recfor});
    const ad=e.target.closest("[data-add]");
    if(ad){
      const k=ad.dataset.add;
      if(k==="task")  return go("taskadd",{due:sel});
      if(k==="score") return go("rec",{date:sel});
      return go("evadd",{date:sel,kind:k});
    }
  };
}

/* ---------- 点数を記録 ---------- */

  if(!tests.length){
    V.innerHTML=`<div class="vhead"><h1 class="t">点数を記録</h1>
      <p class="sub">まずテストを作ります。満点はここで一度だけ決めます。</p></div>
      <div class="empty">まだテストがありません</div>
      <button class="btn" id="new">＋ テストを作る</button>
      ${manageLink()}`;
    $("#new").onclick=()=>go("recnew");
    bindManage(); return;
  }
  const cur=S.tests.find(t=>t.id===ctx.t)||tests[0];
  const a=analyze([cur]);
  V.innerHTML=`
  <div class="vhead"><h1 class="t">点数を記録</h1></div>
  <div class="chips" id="tt">${tests.map(t=>
    `<button class="chip${t.id===cur.id?" on":""}" data-t="${t.id}">${esc(shortName(t))}・${t.max}点</button>`).join("")}

  <div style="text-align:center;padding:22px 0 6px">
    <input id="sc" type="number" inputmode="numeric" min="0" max="${cur.max}" placeholder="0"
      style="width:150px;text-align:center;font-size:54px;font-weight:800;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:0 0 4px">
    <div class="hint" style="margin-top:12px">／ ${cur.max}点（このテストの満点）</div>
  </div>
  <div class="field"><label>実施日</label>
    <div class="chips" id="dq">
      <button class="chip${(ctx.date||today())===today()?" on":""}" data-d="0">今日</button>
      <button class="chip${ctx.date===addDays(today(),-1)?" on":""}" data-d="-1">昨日</button>
    </div>
    <input id="dt" type="date" value="${ctx.date||today()}" max="${today()}" style="margin-top:8px">
    <p class="hint" id="dh"></p>
  </div>
  <div class="field"><label>範囲・単元（任意）</label><input id="rg" type="text" placeholder="未入力"></div>
  ${(()=>{const g=goalOf(cur,a); return g?`<div class="note">いまの目標は <b>${g.v}点</b>（${esc(g.note)}）</div>`:"";})()}
  <button class="btn" id="ok">記録する</button>
  ${manageLink()}`;
  $("#tt").onclick=async e=>{
    const b=e.target.closest("[data-t]"); if(!b) return;
    if(b.dataset.t==="new") return go("recnew");
    go("rec",{t:b.dataset.t});
  };
  const dt=V.querySelector("#dt"), dh=V.querySelector("#dh");
  const showRel=()=>{ const d=diffDays(today(),dt.value);
    dh.textContent = d===0? "" : `${-d}日前の記録として保存されます`; };
  $("#dq").onclick=async e=>{const b=e.target.closest("[data-d]"); if(!b)return;
    V.querySelectorAll("#dq .chip").forEach(c=>c.classList.remove("on")); b.classList.add("on");
    dt.value=addDays(today(),+b.dataset.d); showRel();};
  dt.onchange=showRel;
  $("#ok").onclick=async ()=>{
    const v=V.querySelector("#sc").value;
    if(v==="") return toast("点数を入れてください");
    const score=Math.round(+v);
    if(isNaN(score)||score<0||score>cur.max) return toast(`0〜${cur.max}の範囲で入れてください`);
    const before=analyze([cur]);
    const rec={id:uid(),studentId:S.activeId,testId:cur.id,score,date:dt.value,
      note:V.querySelector("#rg").value.trim(),enteredAt:today()};
    S.records.push(rec); await saveNow(); go("recdone",{t:cur.id,r:rec.id,prevBest:before?before.best:null,prev3:before?before.recent3:null,prevN:before?before.n:0});
  };
  bindManage();
}
const shortName=t=>t.name.length>7? t.name.slice(0,6)+"…" : t.name;
function lastDate(testId){
  const r=mine(S.records).filter(x=>x.testId===testId).map(x=>x.date).sort();
  return r.length? r[r.length-1] : null;
}
const manageLink=()=>`<button class="btn ghost" id="mg">テストの管理</button>
  <button class="btn ghost" id="ls">記録の一覧</button>`;
function bindManage(){
  const a=V.querySelector("#mg"), b=V.querySelector("#ls");
  if(a) a.onclick=()=>go("recmanage");
  if(b) b.onclick=()=>go("reclist");
}

function viewTestNew(){
  V.innerHTML=`
  <div class="vhead"><h1 class="t">テストを作る</h1>
  <p class="sub">最初の一回だけ。次からは点数を入れるだけです。</p></div>
  <div class="field"><label>テスト名</label><input id="nm" type="text" placeholder="英単語テスト"></div>
  ${subjectPicker()}
  <div class="field"><label>種類</label>
    <div class="chips" id="kd">${Object.entries(KINDS).map(([k,l],i)=>
      `<button class="chip${i?"":" on"}" data-k="${k}">${l}</button>`).join("")}</div></div>
  <div class="field" style="border-bottom:2px solid var(--ink)"><label>満点</label>
    <input id="mx" type="number" inputmode="numeric" value="100" min="1" max="1000" style="font-size:30px;font-weight:700">
    <div class="chips" id="mq">${[10,20,50,100].map(n=>`<button class="chip" data-m="${n}">${n}</button>`).join("")}</div>
  </div>
  <div class="field"><label>目標（任意・あとから変えられます）</label>
    <input id="gl" type="number" inputmode="numeric" placeholder="未設定"></div>
  <div id="dup"></div>
  <div class="note"><b>満点は後から変えられません。</b>満点が違うテストは、同じ名前でも別のテストとして記録されます。</div>
  <button class="btn" id="ok">このテストを作る</button>
  <button class="btn ghost" id="cc">やめる</button>`;
  let kind="small";
  bindSubjects();
  $("#kd").onclick=async e=>{const b=e.target.closest("[data-k]"); if(!b)return;
    V.querySelectorAll("#kd .chip").forEach(c=>c.classList.remove("on")); b.classList.add("on"); kind=b.dataset.k;};
  $("#mq").onclick=async e=>{const b=e.target.closest("[data-m]"); if(!b)return;
    V.querySelector("#mx").value=b.dataset.m; checkDup();};
  const nm=V.querySelector("#nm");
  nm.oninput=checkDup;
  V.querySelector("#mx").oninput=checkDup;
  function checkDup(){
    const name=nm.value.trim(), max=+V.querySelector("#mx").value;
    const same=mine(S.tests).filter(t=>t.name===name);
    const box=V.querySelector("#dup");
    if(!name||!same.length){ box.innerHTML=""; return; }
    const exact=same.find(t=>t.max===max);
    box.innerHTML = exact
      ? `<div class="warn"><b>まったく同じテストがあります。</b>${esc(name)}・${max}点（記録${mine(S.records).filter(r=>r.testId===exact.id).length}件）<br>新しく作らず、そのまま記録できます。</div>`
      : `<div class="info"><b>同じ名前のテストがあります。</b><br>${same.map(t=>`${esc(t.name)}・${t.max}点（記録${mine(S.records).filter(r=>r.testId===t.id).length}件）`).join("<br>")}<br>満点が違うので、<b>別のテスト</b>として作られます。これまでの記録はそのまま残ります。</div>`;
  }
  $("#ok").onclick=async ()=>{
    const name=nm.value.trim(), max=Math.round(+V.querySelector("#mx").value);
    if(!name) return toast("テスト名を入れてください");
    if(!(max>0&&max<=1000)) return toast("満点は1〜1000で入れてください");
    if(mine(S.tests).some(t=>t.name===name&&t.max===max)) return toast("同じ名前・同じ満点のテストがすでにあります");
    const t={id:uid(),studentId:S.activeId,name,subjectId:pickedSubject,kind,max,archived:false};
    S.tests.push(t);
    const gv=$("#gl").value;
    if(String(gv).trim()!==""){
      const gn=Math.round(+gv);
      if(!isNaN(gn)&&gn>=0&&gn<=max) S.settings.goals[t.id]=gn;
    }
    await saveNow(); go("rec",{t:t.id});
  };
  $("#cc").onclick=()=>go("rec");
}

/* ---------- 記録した直後 ---------- */
function viewRecDone(){
  const t=S.tests.find(x=>x.id===ctx.t), r=S.records.find(x=>x.id===ctx.r);
  const a=analyze([t]);
  const isBest = ctx.prevBest===null || r.score>ctx.prevBest;
  const enough = ctx.prevN>=MIN_N-1;
  const streak=(()=>{
    if(!a) return 0;
    const rs=a.records.slice().reverse(); let c=0;
    for(const x of rs){ if(x.score>=a.avgRate/100*t.max) c++; else break; }
    return c;
  })();
  V.innerHTML=`
  <div style="text-align:center;padding:18px 0 4px">
    ${isBest&&ctx.prevBest!==null?'<p class="eyebrow" style="color:var(--red);letter-spacing:.2em">自己ベスト更新</p>':
      isBest?'<p class="eyebrow">はじめての記録</p>':'<p class="eyebrow">記録しました</p>'}
    <div style="margin-top:14px">${scoreMark(r.score,ctx.prevBest,"big")}</div>
    <div class="hint" style="margin-top:18px">／ ${t.max}点・${esc(t.name)}</div>
  </div>
  <p class="sec">これまでと比べて</p>
  <div class="card">
    <div class="stat"><span>これまでの自己ベスト</span><b>${ctx.prevBest===null?"—":ctx.prevBest+"点"}</b></div>
    <div class="stat"><span>直近3回の平均</span><b>${ctx.prev3===null?"—":ctx.prev3.toFixed(1)+"点"}</b></div>
    <div class="stat"><span>記録した回数</span><b>${a.n}回</b></div>
    ${streak>1?`<div class="stat"><span>平均を超えた回数</span><b>${streak}回連続</b></div>`:""}
  </div>
  ${goalCard(t,a)}
  <button class="btn ghost" id="cl">閉じる</button>`;
  V.onclick=async e=>{
    const g=e.target.closest("[data-goal]");
    if(g){ const cg=goalOf(t,a); if(await askGoal(t,cg?cg.v:null)) render(); return; }
    if(e.target.closest("#cl")) go("rec",{t:t.id});
  };
}

/* ---------- テストの管理 ---------- */
function viewManage(){
  const map=groupsFor(S.activeId);
  const bySub=new Map();
  for(const [k,list] of map){
    const sid=list[0].subjectId||"-";
    if(!bySub.has(sid)) bySub.set(sid,[]);
    bySub.get(sid).push([k,list]);
  }
  let html=`<div class="vhead"><h1 class="t">テストの管理</h1>
    <p class="sub">満点ごとに分かれています。</p></div>`;
  if(!map.size) html+=`<div class="empty">まだテストがありません</div>`;
  for(const [sid,groups] of bySub){
    html+=`<p class="sec">${sid==="-"?"教科なし":esc(subName(sid))}</p>`;
    for(const [k,list] of groups){
      const sorted=list.slice().sort((a,b)=>a.max-b.max);
      html+=sorted.map(t=>{
        const n=mine(S.records).filter(r=>r.testId===t.id).length;
        const ld=lastDate(t.id);
        return `<div class="item"${t.archived?' style="opacity:.5"':""}>
          <div class="body"><div class="tt">${esc(t.name)}<span class="tag max">${t.max}点</span>
          ${t.archived?'<span class="tag mute">しまってある</span>':""}</div>
          <div class="mm">記録${n}件${ld?"・最終 "+fmt(ld):""}</div></div>
          <button class="chip" data-arc="${t.id}">${t.archived?"戻す":"しまう"}</button></div>`;
      }).join("");
      if(sorted.length>1){
        const on=!!S.settings.grouped[k];
        html+=`<div class="note"><b>この${sorted.length}つをまとめて見ますか。</b>満点が違っても、得点率でつなげば1本の推移として見られます。記録はそのまま、見え方だけが変わります。
          <div class="chips"><button class="chip${on?" on":""}" data-grp="${k}" data-v="1">まとめて見る</button>
          <button class="chip${on?"":" on"}" data-grp="${k}" data-v="0">別々のまま</button></div></div>`;
      }
    }
  }
  html+=`<button class="btn ghost" id="bk">戻る</button>`;
  V.innerHTML=html;
  V.onclick=async e=>{
    const a=e.target.closest("[data-arc]");
    if(a){ const t=S.tests.find(x=>x.id===a.dataset.arc); t.archived=!t.archived; await saveNow(); render(); return; }
    const g=e.target.closest("[data-grp]");
    if(g){ S.settings.grouped[g.dataset.grp]= g.dataset.v==="1"; await saveNow(); render(); return; }
    if(e.target.closest("#bk")) go("rec");
  };
}

/* ---------- 記録の一覧 ---------- */
function viewList(){
  const rs=mine(S.records).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const sub=ctx.s||"all";
  const filtered=rs.filter(r=>{
    if(sub==="all") return true;
    const t=S.tests.find(x=>x.id===r.testId);
    return t && t.subjectId===sub;
  });
  const months=[...new Set(filtered.map(r=>r.date.slice(0,7)))];
  const bestOf={};
  mine(S.records).forEach(r=>{ bestOf[r.testId]=Math.max(bestOf[r.testId]??-1, r.score); });
  V.innerHTML=`
  <div class="vhead"><h1 class="t">記録</h1></div>
  <div class="chips" id="sf">
    <button class="chip${sub==="all"?" on":""}" data-s="all">全部</button>
    ${S.subjects.map(s=>`<button class="chip${sub===s.id?" on":""}" data-s="${s.id}">${esc(s.name)}</button>`).join("")}
  </div>
  ${filtered.length? months.map(m=>{
    const [y,mo]=m.split("-");
    return `<p class="sec">${y}年 ${+mo}月</p>` + filtered.filter(r=>r.date.startsWith(m)).map(r=>{
      const t=S.tests.find(x=>x.id===r.testId)||{name:"?",max:100};
      const rate=Math.round(r.score/t.max*100);
      const best=bestOf[r.testId]??null;
      return `<div class="item"><div class="body">
        <div class="tt">${esc(t.name)}<span class="tag max">${t.max}点</span></div>
        <div class="bar"><i class="${rate<65?"low":""}" style="width:${rate}%"></i></div>
        <div class="mm">${fmt(r.date)}・${r.score} / ${t.max}（${rate}%）${r.note?"・"+esc(r.note):""}</div>
      </div>${scoreMark(r.score,best,"sm")}
      <button class="chip" data-del="${r.id}">削除</button></div>`;
    }).join("");
  }).join("") : `<div class="empty">まだ記録がありません</div>`}
  <div class="note">バーは得点率です。満点の違うテストを並べて見るためのものです。</div>
  <button class="btn ghost" id="bk">戻る</button>`;
  $("#sf").onclick=async e=>{const b=e.target.closest("[data-s]"); if(b) go("reclist",{s:b.dataset.s});};
  V.onclick=async e=>{
    const d=e.target.closest("[data-del]");
    if(d){ if(await ok("この記録を削除しますか",{danger:true,okLabel:"削除"})){ S.records=S.records.filter(r=>r.id!==d.dataset.del); await saveNow(); render(); } return; }
    if(e.target.closest("#bk")) go("rec");
  };

  </div>

  ${a.enough?"":`<div class="note">記録が${MIN_N}回になると、傾向が出せるようになります。いまは${a.n}回。<br><b>少ない記録で線を引くと、実際より大きく見えてしまいます。</b></div>`}
  ${a.max<=20?`<div class="note"><b>${a.max}点満点は1問で${Math.round(100/a.max)}%動きます。</b>満点の大きいテストと同じようには比べられません。</div>`:""}
  `}
  <div class="note">このアプリは偏差値を出しません。比べる相手がいないためです。点数の予測もしません。</div>`;
  $("#tt").onclick=async e=>{const b=e.target.closest("[data-t]"); if(b) go("ana",{t:b.dataset.t});};
  const gb=V.querySelector("[data-goal]");
  if(gb) gb.onclick=async ()=>{
    const cg=goalOf(cur,a);
    if(await askGoal(cur,cg?cg.v:null)) render();
  };
}
function chart(a,group){
  const W=300,H=110,P=6;
  const pts=a.rates.map((v,i)=>{
    const x=a.rates.length===1? W/2 : P+i*(W-P*2)/(a.rates.length-1);
    return [x, H-8-(v/100)*(H-22)];
  });
  const line=pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
  // 満点が変わった位置
  let marks="";
  if(group.length>1){
    let prev=null;
    a.records.forEach((r,i)=>{
      const m=(S.tests.find(t=>t.id===r.testId)||{}).max;
      if(prev!==null&&m!==prev){ const x=pts[i][0];
        marks+=`<line x1="${x.toFixed(1)}" y1="4" x2="${x.toFixed(1)}" y2="${H-8}" stroke="#B8860B" stroke-dasharray="2 3"/>`; }
      prev=m;
    });
  }
  // 目標の帯（予測ではなく目安。記録が増えるほど狭くなる）
  let band="";
  if(a.enough&&a.goal!==null){
    const gy=H-8-(a.goal/a.max*100/100)*(H-22);
    const w=Math.max(4,20-a.n);
    band=`<rect x="${W-14}" y="${(gy-w).toFixed(1)}" width="14" height="${(w*2).toFixed(1)}" fill="#2A5D8A" opacity=".13"/>
      <line x1="${W-14}" y1="${gy.toFixed(1)}" x2="${W}" y2="${gy.toFixed(1)}" stroke="#2A5D8A" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px" role="img" aria-label="得点率の推移">
    <line x1="0" y1="${H-8}" x2="${W}" y2="${H-8}" stroke="#E4E1D8"/>
    <line x1="0" y1="${(H-8-(H-22)/2).toFixed(1)}" x2="${W}" y2="${(H-8-(H-22)/2).toFixed(1)}" stroke="#EFECE4" stroke-dasharray="3 3"/>
    ${marks}${band}
    <polyline points="${line}" fill="none" stroke="#2A5D8A" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#2A5D8A"/>`).join("")}
  </svg>
  <div class="hint" style="display:flex;justify-content:space-between">
    <span>${fmt(a.records[0].date)}</span>
    <span>0〜100%${a.enough&&a.goal!==null?"　右の帯は目標の目安（予測ではありません）":""}</span>
    <span>${fmt(a.records[a.records.length-1].date)}</span></div>`;
}

function sheetHTML(from,to){
  const st=me();
  const rows=mine(S.tests).map(t=>{
    const rs=mine(S.records).filter(r=>r.testId===t.id&&r.date>=from&&r.date<=to)
      .sort((a,b)=>a.date.localeCompare(b.date));
    if(!rs.length) return null;
    const sc=rs.map(r=>r.score);
    return {t,n:rs.length,avg:Math.round(mean(sc)/t.max*100),last3:sc.slice(-3).join(" / ")};
  }).filter(Boolean);
  const small=rows.filter(r=>r.t.kind!=="term"), term=rows.filter(r=>r.t.kind==="term");
  const tasks=mine(S.tasks).filter(x=>x.due&&x.due>=from&&x.due<=to);
  const late=tasks.filter(x=>!x.done||(x.doneAt&&x.doneAt>x.due)).length;
  const unrec=mine(S.events).filter(e=>e.kind==="test"&&e.date&&e.date>=from&&e.date<=to
    && !mine(S.records).some(r=>r.date===e.date)).length;
  const row=r=>`<tr><td>${esc(r.t.name)}</td><td class="num">${r.t.max}</td><td class="num">${r.n}</td>
    <td class="num">${r.n>=3? r.avg+"%" : "—"}</td><td class="num">${r.n>=3? esc(r.last3) : "記録が少ないため省略"}</td></tr>`;
  return `
  <p class="sheet-h">学習記録シート</p>
  <p class="sheet-m">${esc(st.name)}／${esc(st.grade)}　${from.replace(/-/g,".")} – ${to.replace(/-/g,".")}　作成 ${to.replace(/-/g,".")}</p>
  <table class="sh"><thead><tr><th>テスト</th><th style="text-align:right">満点</th><th style="text-align:right">回数</th>
    <th style="text-align:right">平均</th><th style="text-align:right">直近3回</th></tr></thead>
    <tbody>${small.length? small.map(row).join("") : `<tr><td colspan="5">記録なし</td></tr>`}</tbody></table>
  ${term.length?`<p class="sheet-m" style="margin-top:8px">定期テスト</p>
    <table class="sh"><tbody>${term.map(r=>
      `<tr><td>${esc(r.t.name)}</td><td class="num">${r.t.max}点満点</td><td class="num">${r.n}回</td><td class="num">${r.avg}%</td></tr>`).join("")}</tbody></table>`:""}
  <p class="sheet-m" style="margin-top:8px">提出のようす：${tasks.length}件中 期限すぎ ${late}件${unrec?`／点数が未記録のテスト ${unrec}件`:""}</p>
  <p class="sheet-m" style="margin-bottom:2px">聞いてみたいこと</p>
  <div class="freebox"></div>`;
}

    el.href=url; el.download=`学習記録_${today().replace(/-/g,"")}.json`;

    const pass=await ask("合言葉",null,{type:"password",ph:"書き出したときの合言葉"});
    if(pass===null) return;
    let out;
    try{ out=await decryptJSON(obj,pass); }
    catch(e){ return toast("合言葉が違うか、ファイルがこわれています"); }
    if(!await ok("いまの記録をすべて置きかえます。\n取り消せません。",{title:"読み込む",danger:true,okLabel:"置きかえる"})) return;
    const backup=S;
    try{
      const n=out.obj;
      if(!n||!Array.isArray(n.students)) throw new Error("bad");
      const r=migrate(n);
      if(r.error==="newer") throw new Error("このファイルは新しい版のアプリで作られています");
      if(r.error) throw new Error("bad");
      await Store.set(backup,"state_before_import");
      S=r.state;
      await Store.set(S);
      V.querySelector("#imres").innerHTML=
        `<div class="card"><p class="eyebrow" style="margin:0">確認番号</p>
         <div style="font-size:19px;font-weight:700;letter-spacing:.1em;margin-top:4px">${out.check}</div>
         <p class="hint">書き出したときと同じ番号なら成功です。</p></div>`;
      setTimeout(()=>go("tasks"),1200);
    }catch(e){ S=backup; toast("読み込みに失敗したため、元に戻しました"); }
  };
  $("#bk").onclick=()=>go("set");
}

/* ============================================================
   6. ロック
   ============================================================ */
const LOCK=document.getElementById("lock");
let entry="", locked=false, lockTick=null;
const MAX_TRY=3, WAIT_MS=60*60*1000;   // 3回まちがえたら1時間後に解除できる

function lock(){
  if(!S.settings.pass||locked) return;
  locked=true; entry="";
  LOCK.classList.remove("hidden");
  drawLock("");
  clearInterval(lockTick);
  lockTick=setInterval(()=>{ if(locked&&S.settings.lockUntil) drawLock(""); },1000);
}
function unlockNow(){
  locked=false; entry="";
  clearInterval(lockTick); lockTick=null;
  S.settings.failCount=0; S.settings.lockUntil=null; save();
  LOCK.classList.add("hidden"); touch();
}
const remain=()=> S.settings.lockUntil? Math.max(0,S.settings.lockUntil-Date.now()) : 0;
function fmtRemain(ms){
  const m=Math.ceil(ms/60000);
  return m>=60? `${Math.floor(m/60)}時間${m%60}分` : `${m}分`;
}
function drawLock(msg){
  const waiting = !!S.settings.lockUntil && remain()>0;
  const openable = !!S.settings.lockUntil && remain()<=0;
  LOCK.innerHTML=`
  <div style="text-align:center">
    <div class="maru sm" style="display:inline-flex">${MARU}<span class="n" style="font-size:16px">記</span></div>
    <p style="font-size:15px;font-weight:700;margin:20px 0 2px">${openable?"パスコードなしで開けます":"パスコードを入力"}</p>
    <p class="msg">${openable?"新しい番号は、あとから決め直せます":(msg||"&nbsp;")}</p>
  </div>
  ${openable? `
    <button id="emg" style="background:#E9E6DC;color:#161A18;border-radius:11px;padding:14px 28px;font-size:14.5px;font-weight:700;margin-top:10px">パスコードなしで開く</button>
    <p class="msg" style="margin-top:20px;max-width:280px;text-align:center;line-height:1.7">これまでの記録は、すべて残っています。</p>`
  : `
    <div class="dots">${[0,1,2,3].map(i=>`<span class="dot ${i<entry.length?"f":""}"></span>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
      <button class="blank"></button><button data-k="0">0</button><button class="small" data-k="x">消す</button></div>
    ${waiting? `<p class="msg" style="margin-top:22px;max-width:290px;text-align:center;line-height:1.8">
      あと <b style="color:#E9E6DC">${fmtRemain(remain())}</b> で、パスコードなしで開けるようになります。<br>思い出したら、いつでも入力できます。</p>`:""}`}`;
  const emg=LOCK.querySelector("#emg");
  if(emg) emg.onclick=async ()=>{
    S.settings.pass=null;          // 忘れた番号を残すと、次に開くときまた閉じ込められる
    unlockNow();
    toast("パスコードを解除しました。設定から新しい番号を決められます。");
    go("set");
  };
  const pad=LOCK.querySelector(".pad");
  if(pad) pad.onclick=async e=>{
    const b=e.target.closest("[data-k]"); if(!b) return;
    if(b.dataset.k==="x"){ entry=entry.slice(0,-1); return drawLock(""); }
    if(entry.length>=4) return;
    entry+=b.dataset.k; drawLock("");
    if(entry.length===4){
      const h=await hashPass(entry,S.settings.pass.salt);
      if(h.hash===S.settings.pass.hash) return unlockNow();
      entry="";
      S.settings.failCount=(S.settings.failCount||0)+1;
      if(S.settings.failCount>=MAX_TRY && !S.settings.lockUntil){
        S.settings.lockUntil=Date.now()+WAIT_MS; S.settings.failCount=0; save();
        drawLock("3回まちがえました");
      }else{ save(); drawLock(`番号が違います（あと${MAX_TRY-S.settings.failCount}回）`); }
    }
  };
}
/* 放置していても自動では閉じない。ロックは起動時だけ。
   使うたびに番号を求められる煩わしさのほうが、実害より大きいため。 */
function touch(){ lastActive=Date.now(); }

/* ============================================================
   7. 起動
   ============================================================ */
function standalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
}
function installHint(){
  const box=document.getElementById("install");
  if(standalone() || location.protocol==="file:" || sessionStorage===undefined) return;
  let hidden=false;
  try{ hidden = document.cookie.indexOf("nohint=1")>=0; }catch(e){}
  if(hidden) return;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  box.innerHTML=`
    <div style="flex:1">
      <b>ホーム画面に置けます。</b><br>
      <span style="opacity:.9">
        ${ios
          ? '① 下の <b>共有ボタン</b>（四角に上矢印）を押す<br>② 「<b>ホーム画面に追加</b>」を選ぶ<br>③ 右上の「<b>追加</b>」を押す'
          : '① 右上の <b>メニュー</b>（点が3つ縦に並んだマーク）を押す<br>② 「<b>ホーム画面に追加</b>」を選ぶ'}
      </span><br>
      <span style="opacity:.7;font-size:11.5px">次からアイコンから開けます。ダウンロードするものではありません。</span>
    </div>
    <button id="hintx" aria-label="閉じる">閉じる</button>`;
  box.classList.remove("hidden");
  document.body.classList.add("hint");
  const x=box.querySelector("#hintx");
  if(x) x.onclick=()=>{
    box.classList.add("hidden");
    document.body.classList.remove("hint");
    try{ document.cookie="nohint=1;max-age=15552000;path=/"; }catch(e){}
  };
}
window.addEventListener("error",e=>{ toast("エラー："+(e.message||"")); });
window.addEventListener("unhandledrejection",e=>{
  const m=(e.reason&&e.reason.message)||""; if(m) toast("エラー："+m);
});
(async function boot(){
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
  }
  await Store.open();
  if(navigator.storage&&navigator.storage.persist){
    try{ await navigator.storage.persist(); }catch(e){}
  }
  const saved=await Store.get();
  if(!saved){ S=blank(); }
  else{
    const r=migrate(saved);
    if(r.error==="newer"){
      S=blank();
      toast("この端末の記録は、新しい版のアプリで作られています。\n古い版で開くと壊れるおそれがあるため、読み込みませんでした。\nアプリを最新にしてから開いてください。");
      locked=true;
    }else if(r.error){
      S=blank();
      toast("記録を読み込めませんでした。書き出したファイルがあれば、設定から読み込んでください。");
    }else{
      if(r.migrated){ await Store.set(saved,"state_before_migration"); }
      S=r.state;
      if(r.migrated){ await Store.set(S); }
    }
  }
  if(S.settings.pass) lock();
  render();
  setTimeout(installHint,1500);
  window.addEventListener("beforeunload",e=>{ if(dirty) Store.set(S); });
})();
</script>
</body>
</html>
